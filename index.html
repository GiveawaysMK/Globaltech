<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 17 Pro Max Giveaway</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=BAAp4KE8A-c9gp8ICjTHkHPVK3JH8LK1M6iXXTZNePW6y3gpmQFOYVpnBC7k8TBcFUZmw1u47Zp2Ax69Fs&currency=USD"></script>
    <style>
        :root {
            --bg-dark: #050505;
            --accent: #FF6B00;
            --glass: rgba(255, 255, 255, 0.06);
            --text-white: #FFFFFF;
        }

        * { box-sizing: border-box; touch-action: manipulation; }
        
        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 50% -20%, #2a1200, #050505);
            padding: 20px;
            position: relative;
        }

        .screen { display: none; flex-direction: column; height: 100%; opacity: 0; transition: opacity 0.3s; }
        .screen.active { display: flex; opacity: 1; }

        .logo-wrapper {
            margin: 20px auto 15px auto;
            width: 80px; height: 80px;
            background: var(--accent);
            border-radius: 24px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 40px rgba(255, 107, 0, 0.3);
            flex-shrink: 0;
        }

        h1 { font-size: 24px; text-align: center; margin: 0 0 5px 0; }
        .counter { font-size: 14px; text-align: center; color: var(--accent); font-weight: bold; margin-bottom: 20px; }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid #333;
            padding: 15px;
            border-radius: 12px;
            color: white;
            margin: 10px 0;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Screen 1 -->
    <div id="s1" class="screen active">
        <div class="logo-wrapper"></div>
        <h1>iPhone 17 Pro Max Giveaway</h1>
        <div class="counter" id="participantCount">1,248+ participants</div>
        <div class="card">
            <strong>Official Event Details:</strong><br>
            • 15 units of iPhone 17 Pro Max.<br>
            • Live drawing: Aug 25, 2026.<br>
            • Max 50 entries per user.<br>
            • Winners notified via email.
        </div>
        <button onclick="goTo(2)">Start Registration</button>
    </div>

    <!-- Screen 2 -->
    <div id="s2" class="screen">
        <h2 style="text-align:center">Registration</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="email" id="email" placeholder="Email Address">
        <input type="number" id="pts" placeholder="Entries (Max 50)" max="50">
        <div id="paypal-button-container" style="margin-top:20px"></div>
        <button onclick="goTo(1)" style="background:#333; margin-top:10px">Back</button>
    </div>

    <!-- Screen 3 -->
    <div id="s3" class="screen">
        <h2 style="text-align:center">Success!</h2>
        <div class="card" id="codeDisplay"></div>
        <button onclick="location.reload()">Done</button>
    </div>
</div>

<script>
    const firebaseConfig = { /* ...вашиот конфиг... */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function goTo(n) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('s'+n).classList.add('active');
    }

    // Лимит од 50 поени
    document.getElementById('pts').addEventListener('input', function() {
        if(this.value > 50) this.value = 50;
    });

    // Firebase live counter
    db.ref('participants').on('value', snap => {
        const count = 1248 + (snap.numChildren() || 0);
        document.getElementById('participantCount').innerText = count.toLocaleString() + "+ participants";
    });

    // PayPal logic (skipping full code here for brevity, keep existing integration)
</script>
</body>
</html>
